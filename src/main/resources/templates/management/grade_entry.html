<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>成绩录入</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #4a4b8c;
            color: #e0e0e0;
            min-height: 100vh;
        }
        .form-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 2rem;
            margin-bottom: 2rem;
        }
        .score-excellent { color: #28a745; font-weight: bold; }
        .score-good { color: #20c997; }
        .score-average { color: #ffc107; }
        .score-poor { color: #fd7e14; }
        .score-fail { color: #dc3545; font-weight: bold; }
        .is-invalid {
            border-color: #dc3545 !important; /* 红色边框 */
            box-shadow: 0 0 0 0.2rem rgba(220, 53, 69, 0.25) !important; /* 红色阴影光晕 */
        }
        /* 可选：有效状态的样式 */
        .is-valid {
            border-color: #28a745 !important;
            box-shadow: 0 0 0 0.2rem rgba(40, 167, 69, 0.25) !important;
        }
        .invalid-feedback {
            color: #dc3545;
            font-size: 0.875em;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>成绩录入</h2>
            <button class="btn btn-primary" onclick="showDashboard()">返回首页</button>
        </div>

        <!-- 消息提示 -->
        <div th:if="${successMessage}" id="successMessage" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" id="errorMessage" name="errorMessage" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row">
            <div class="col-md-6">
                <div class="form-container">
                    <h5>录入新成绩</h5>
                    <form th:action="@{/grade/management/addGrade}" method="post" id="gradeForm">
                        <div class="mb-3">
                            <label class="form-label">学号</label>
                            <input type="text" class="form-control" id="student_id" name="student_id" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">课程</label>
                            <!--<select class="form-select" id="course" name="course" required>
                                <option th:each="course : ${courses}" th:value="${course.course_id}" th:text="${course.course_name}"></option>
                            </select>-->

                            <!-- 使用 input 和 datalist 替代 select -->
                            <input class="form-control" list="courseOptions" id="courseInput" name="course" placeholder="输入课程名称进行搜索..." autocomplete="off">
                            <datalist id="courseOptions">
                                <!-- 使用Thymeleaf动态遍历课程列表 -->
                                <option class="form-control" th:each="course : ${courses}" th:value="${course.course_id}" th:text="${course.course_name}"></option>
                            </datalist>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">成绩</label>
                            <input type="text" id="score" class="form-control" pattern="^(100|[1-9]?[0-9])$"
                                placeholder="请输入0-100之间的数字" oninput="validateScoreText(this)" value="0" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">考试类型</label>
                            <select class="form-select" name="exam_type" required>
                                <option value="0">期中考试</option>
                                <option value="1">期末考试</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">考试日期</label>
                            <input type="date" class="form-control" name="exam_date" required>
                        </div>
                        
                        <button type="submit" class="btn btn-success">录入成绩</button>
                    </form>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">最近成绩记录</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>学号</th>
                                        <th>姓名</th>
                                        <th>课程</th>
                                        <th>成绩</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="grade : ${grades}">
                                        <td th:text="${grade.student_id}">2021001001</td>
                                        <td th:text="${grade.student_name}">张三</td>
                                        <td th:text="${grade.course_name}">数据库基础</td>
                                        <td th:text="${grade.score}">85.5</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/grade.js}"></script>  <!-- 先加载grade.js -->
    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/jquery.min.js}"></script>  <!-- 后加载jQuery -->
    <script>
        function showDashboard() {
            window.location.href = '/dashboard';
        }
        
        // 设置默认考试日期为今天
        document.addEventListener('DOMContentLoaded', function() {
            const today = new Date().toISOString().split('T')[0];
            document.querySelector('input[name="exam_date"]').value = today;
        });
    </script>
    
    
    
</body>
</html>
